name: Smoke

on: push

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post test application
        run: |
          curl --fail-with-body --silent --show-error --location --connect-timeout 15 --max-time 45 \
            --data-urlencode "request_id=codex-smoke-20260914-03" \
            --data-urlencode "route=new" \
            --data-urlencode "name=CODEX TEST FORM 2" \
            --data-urlencode "telegram=@codex_test" \
            --data-urlencode "email=codex-test@tutvse.community" \
            --data-urlencode "role=tut vse community manager" \
            --data-urlencode "portfolio=https://tutvse.community/?codex-smoke-test-2" \
            --data-urlencode "about=Second technical smoke test after updating the application endpoint." \
            --data-urlencode "source=CODEX SMOKE TEST 2 - safe to delete" \
            --data-urlencode "page_url=https://tutvse.community/" \
            --data-urlencode "user_agent=Codex smoke test via GitHub Actions" \
            --data-urlencode "elapsed_ms=1000" \
            --data-urlencode "website=" \
            "https://script.google.com/macros/s/AKfycbwShq1U2IjOhI1hAD3r4hsQMa-bQZPKJG71GaQdZiK6dZ0B6HbfDgS4DBvF8NmXDsFp_Q/exec" \
            | tee response.html
          grep -q '"ok":true' response.html
